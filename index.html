<style>
/* Layout: one-screen map app. Real street map fills the screen; events in a bottom sheet (side panel on wide screens). Light look. */
:root {
  --paper: #f5f6f9;
  --card: #ffffff;
  --soft: #eef0f5;
  --line: #e0e2ea;
  --ink: #0f0d14;       /* black */
  --muted: #625d70;
  --hot: #7c3aed;       /* purple accent */
  --hot-deep: #5b21b6;
  --hot-soft: #f1ebfe;
  --hot-ink: #ffffff;
  --party: #e0336f;
  --social: #e08600;
  --sport: #1c9b5a;
  --society: #2563eb;
  --other: #7b7689;
  --danger: #c8372d;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }

#app { position: fixed; inset: 0; overflow: hidden; }
#map { position: absolute; inset: 0; z-index: 1; background: var(--soft); }
.leaflet-container { font-family: var(--f-body); }
.leaflet-control-attribution { font-size: 10px; }

/* Header */
.top {
  position: absolute; z-index: 1001; left: 0; right: 0; top: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: var(--gl); padding-right: var(--gr); padding-bottom: 14px;
  background: linear-gradient(var(--paper) 62%, rgba(245,246,249,0));
  display: grid; gap: 10px;
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.brandrow { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark {
  width: 28px; height: 28px; flex: none;
  border-radius: 50% 50% 50% 4px; transform: rotate(-45deg);
  background: var(--ink); display: grid; place-items: center;
}
.mark span { width: 10px; height: 10px; border-radius: 50%; background: var(--hot); }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; line-height: 1; }
.city { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--hot-ink); border: 1px solid var(--ink); background: var(--ink); border-radius: 999px; padding: 3px 8px; }
.spacer { flex: 1; }
.pillbtn {
  border: 1px solid var(--ink); background: var(--ink); color: var(--hot-ink); border-radius: 999px;
  padding: 7px 12px; font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  box-shadow: 0 1px 2px rgba(23,21,31,.06);
}
.pillbtn svg { width: 16px; height: 16px; }
.chips {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin-inline: calc(-1 * var(--gl)) calc(-1 * var(--gr));
  padding-inline: var(--gl) var(--gr); padding-bottom: 2px;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 7px 13px; font-size: 13.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  box-shadow: 0 1px 2px rgba(23,21,31,.05);
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.chip.time[aria-pressed="true"] { background: var(--hot); border-color: var(--hot); color: var(--hot-ink); }
.chipsep { flex: none; width: 1px; background: var(--line); margin-block: 6px; }

/* Map controls */
.mapctl { position: absolute; z-index: 1001; right: var(--gr); top: 130px; display: grid; gap: 6px; }
.mapctl button {
  width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
  font-size: 19px; font-weight: 600; display: grid; place-items: center;
  box-shadow: 0 2px 8px rgba(23,21,31,.08);
}
.mapctl svg { width: 19px; height: 19px; }
.banner {
  position: absolute; z-index: 1001; left: var(--gl); right: var(--gr); top: 124px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;
  font-size: 13.5px; color: var(--muted); box-shadow: 0 4px 16px rgba(23,21,31,.08);
  margin-right: 54px;
}
.banner strong { color: var(--ink); }

/* Pins */
.pin-wrap { position: relative; }
.pin {
  position: absolute; left: 0; top: 0;
  width: 20px; height: 20px; margin: -10px 0 0 -10px;
  border-radius: 50%; background: var(--c);
  border: 3px solid #fff;
  box-shadow: 0 0 0 1px rgba(23,21,31,.25), 0 3px 8px rgba(23,21,31,.25);
}
.pin-label {
  position: absolute; left: 14px; top: -9px;
  white-space: nowrap; font-weight: 700; font-size: 12.5px; color: var(--ink);
  text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff, 0 0 4px #fff;
  pointer-events: none;
}
.selected .pin { width: 28px; height: 28px; margin: -14px 0 0 -14px; box-shadow: 0 0 0 3px var(--c), 0 4px 12px rgba(23,21,31,.3); }
.hide-labels .pin-label { display: none; }
.hide-labels .selected .pin-label { display: block; }
.area-label {
  font-family: var(--f-display); font-weight: 800; font-size: 12px;
  letter-spacing: .16em; text-transform: uppercase; color: var(--hot);
  white-space: nowrap; transform: translate(-50%, -50%);
  text-shadow: 0 0 3px #fff, 0 0 4px #fff, 0 0 6px #fff;
  pointer-events: none; position: absolute;
}
.me-dot { width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #2f7bf5; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(47,123,245,.2); position: absolute; }

/* Sheet */
#sheet {
  position: absolute; z-index: 1001; left: 0; right: 0; bottom: 0;
  height: 38%; min-height: 220px;
  background: var(--card); border-radius: 22px 22px 0 0;
  box-shadow: 0 -6px 30px rgba(23,21,31,.14);
  display: grid; grid-template-rows: auto 1fr;
  transition: height .28s ease;
}
#sheet.expanded { height: 76%; }
.sheethead {
  padding-left: var(--gl); padding-right: var(--gr); padding-block: 8px 10px;
  display: grid; gap: 10px;
}
.grabbtn { display: grid; gap: 8px; border: 0; background: none; text-align: left; width: 100%; padding: 0; }
.searchbox { position: relative; display: flex; align-items: center; }
.searchbox svg { position: absolute; left: 12px; width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
.searchbox input {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--soft);
  border-radius: 999px; padding: 10px 40px 10px 38px; font-size: 15px;
}
.searchbox input:focus { outline: none; border-color: var(--hot); background: var(--card); box-shadow: 0 0 0 3px var(--hot-soft); }
.searchbox input::-webkit-search-cancel-button { display: none; }
.searchbox .clear { position: absolute; right: 6px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--line); font-size: 16px; line-height: 1; }
.searchnote { font-size: 12.5px; color: var(--muted); margin: -2px 0 0; }
.sortbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sortbar .searchnote { margin: 0; }
.sortseg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--card); flex: none; }
.sortseg button { border: 0; background: none; border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.sortseg button.on { background: var(--ink); color: #fff; }
.item.top .goingpill { color: var(--hot-deep); font-weight: 700; background: var(--hot-soft); padding: 3px 8px; border-radius: 999px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
.sheettitle { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sheettitle h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; }
.sheettitle span { color: var(--muted); font-size: 13px; }
#list {
  overflow-y: auto; padding-left: var(--gl); padding-right: var(--gr);
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  display: grid; align-content: start; gap: 8px;
}
.item {
  display: grid; grid-template-columns: 60px 1fr auto; gap: 12px; align-items: center;
  text-align: left; border: 1px solid var(--line); background: var(--card);
  border-radius: 16px; padding: 10px 12px; width: 100%;
}
.item:hover { border-color: var(--hot); }
.when { display: grid; gap: 1px; font-family: var(--f-mono); }
.when b { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.when strong { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.what { min-width: 0; display: grid; gap: 2px; }
.what .t { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.what .s { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.what .s .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.goingpill { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.goingpill.me { color: var(--hot-deep); font-weight: 700; }
.empty { border: 1px dashed #c9ccd8; border-radius: 16px; padding: 18px; color: var(--muted); display: grid; gap: 6px; }
.empty strong { color: var(--ink); font-family: var(--f-display); font-size: 17px; }

#fab {
  position: absolute; z-index: 1002; right: var(--gr);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  border: 0; background: var(--hot); color: var(--hot-ink); border-radius: 999px;
  padding: 14px 20px; font-weight: 700; font-size: 15px;
  display: inline-flex; align-items: center; gap: 8px;
  box-shadow: 0 8px 24px rgba(124,58,237,.38);
}
#fab svg { width: 18px; height: 18px; }

/* Dialogs */
.overlay { position: absolute; inset: 0; z-index: 2000; background: rgba(23,21,31,.38); display: grid; align-items: end; justify-items: center; }
.dialog {
  width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto;
  background: var(--card); border-radius: 24px 24px 0 0;
  padding-left: var(--gl); padding-right: var(--gr);
  padding-top: 18px; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 14px;
}
.dhead { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
.close { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft); font-size: 18px; line-height: 1; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tag .dot { width: 9px; height: 9px; border-radius: 50%; }
.dialog h3 { margin: 6px 0 0; font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance; }
.facts { display: grid; gap: 8px; margin: 0; }
.fact { display: grid; grid-template-columns: 74px 1fr; gap: 10px; }
.fact dt { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding-top: 2px; }
.fact dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 14px; }
.desc { margin: 0; }
.note { font-size: 13px; color: var(--muted); background: var(--soft); border-radius: 12px; padding: 10px 12px; }
.note.warn { color: #8a4b00; background: #fff3e0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 11px 16px; font-weight: 700; font-size: 14px; text-decoration: none;
  display: inline-flex; align-items: center; gap: 8px; color: var(--ink);
}
.btn.primary { background: var(--hot); color: var(--hot-ink); border-color: var(--hot); }
.btn.dark { background: var(--ink); color: var(--card); border-color: var(--ink); }
.btn.on { background: transparent; color: var(--hot); border-color: var(--hot); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; }
.linkish { background: none; border: 0; color: var(--hot); font-weight: 700; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }

/* Add flow */
.drop {
  border: 2px dashed #c9ccd8; border-radius: 18px; padding: 24px 18px;
  display: grid; justify-items: center; gap: 8px; text-align: center; background: var(--soft);
}
.drop.over { border-color: var(--hot); }
.drop strong { font-family: var(--f-display); font-size: 19px; }
.drop p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 36ch; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.reading { display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: center; }
.reading img { width: 84px; height: 112px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); }
.reading .status { display: grid; gap: 6px; }
.reading .status strong { font-family: var(--f-display); font-size: 18px; }
.pulse { width: 100%; height: 4px; border-radius: 2px; background: var(--soft); overflow: hidden; }
.pulse i { display: block; height: 100%; width: 40%; background: var(--hot); border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
@media (prefers-reduced-motion: reduce) { .pulse i { animation: none; width: 100%; } #sheet { transition: none; } }

form.eventform { display: grid; gap: 12px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > label, .field .lbl { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea {
  width: 100%; background: var(--card); border: 1px solid #d3d6e0; border-radius: 12px; padding: 10px 12px; min-width: 0;
}
.field textarea { resize: vertical; min-height: 64px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .row3 { grid-template-columns: 1fr 1fr; } .row3 .field:first-child { grid-column: 1 / -1; } }
.searchrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.results { display: grid; gap: 4px; }
.results button { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; }
.results button:hover { border-color: var(--hot); }
#miniMap { height: 210px; border-radius: 14px; border: 1px solid var(--line); overflow: hidden; }
.hint { font-size: 12.5px; color: var(--muted); }
.hint.hot { color: var(--hot); }
.err { font-size: 13px; color: var(--danger); font-weight: 600; }
.check { display: flex; gap: 10px; align-items: start; font-size: 14px; font-weight: 600; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--hot); }
.check small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 400; }
.cats { display: flex; flex-wrap: wrap; gap: 8px; }
.cats input { position: absolute; opacity: 0; pointer-events: none; }
.cats label { border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
.cats input:checked + label { background: var(--ink); color: var(--card); border-color: var(--ink); }
.cats input:focus-visible + label { outline: 2px solid var(--hot); outline-offset: 2px; }
.cats .dot { width: 8px; height: 8px; border-radius: 50%; }
#cardOverlay { background: rgba(15,13,20,.16); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg label { flex-direction: column; align-items: flex-start; border-radius: 14px; padding: 10px 12px; gap: 2px; }
.seg label small { font-weight: 400; font-size: 12px; color: var(--muted); }
.cats input:checked + label small { color: inherit; opacity: .8; }
.stops { display: grid; gap: 8px; }
.stoprow { display: grid; grid-template-columns: 26px 96px 1fr auto auto; gap: 6px; align-items: center; }
.stoprow input, .stoprow select { border: 1px solid #d3d6e0; border-radius: 10px; padding: 8px; min-width: 0; width: 100%; background: var(--card); }
.stoprow.active input, .stoprow.active select { border-color: var(--hot); }
@media (max-width: 440px) { .stoprow { grid-template-columns: 26px 1fr auto auto; } .stoprow select { grid-column: 2 / -1; grid-row: 2; } }
.stopnum { width: 24px; height: 24px; border-radius: 50%; background: var(--hot); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 12px; flex: none; }
.pinbtn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 10px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.stoprow.active .pinbtn { background: var(--hot); color: #fff; border-color: var(--hot); }
.rmbtn { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--soft); font-size: 16px; line-height: 1; }
.stopmark {
  position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%;
  background: var(--c); color: #fff; border: 2.5px solid #fff; display: grid; place-items: center;
  font: 800 12px var(--f-body); box-shadow: 0 2px 6px rgba(15,13,20,.35);
}
.stop-label {
  position: absolute; left: 17px; top: -9px; white-space: nowrap; font-weight: 700; font-size: 12px; color: var(--ink);
  text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff, 0 0 4px #fff; pointer-events: none;
}
.routehead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.lbl2 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 24px 50px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; position: relative; cursor: pointer; }
.timeline li:not(:last-child)::after { content: ""; position: absolute; left: 11px; top: 33px; bottom: -9px; border-left: 2px dotted var(--hot); }
.timeline li .nm { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.timeline li.next .stopnum { box-shadow: 0 0 0 4px var(--hot-soft); }
.timeline li.next .nm::after { content: " · next"; color: var(--hot-deep); font-weight: 700; font-size: 12.5px; }
.timeline li.past { opacity: .5; }
.minilink { font-size: 13px; font-weight: 700; color: var(--hot-deep); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
.invite { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--hot-deep); background: var(--hot-soft); border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 2px; }
.qrbox { display: grid; justify-items: center; gap: 12px; padding: 8px 0; }
#qr { background: #fff; padding: 14px; border-radius: 16px; border: 1px solid var(--line); }
#qr img, #qr canvas { display: block; width: 240px; height: 240px; }
.urltext { font-family: var(--f-mono); font-size: 13px; overflow-wrap: anywhere; text-align: center; user-select: all; }

#toast {
  position: absolute; z-index: 3000; left: 50%; transform: translateX(-50%);
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--card); padding: 10px 16px; border-radius: 999px;
  font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); text-align: center;

  const AREA_LABELS = [

    ["Claypath", 54.7787, -1.5703],
    ["Gilesgate", 54.7798, -1.5612],
    ["Elvet", 54.7716, -1.5672],
    ["The Viaduct", 54.7800, -1.5850],
    ["The Hill", 54.7622, -1.5790],

  const CATS = {
    party:   { label: "Party",   color: "#e0336f" },
    social:  { label: "Social",  color: "#e08600" },
    sport:   { label: "Sport",   color: "#1c9b5a" },
    society: { label: "Society", color: "#2563eb" },
    other:   { label: "Other",   color: "#7b7689" },
  };
  const TIMES = [
    { id: "tonight", label: "Tonight" },
    { id: "week", label: "This week" },
    { id: "all", label: "All upcoming" },
  ];
  const HOME = { center: [54.7712, -1.5745], zoom: 15 };
  const DURHAM_BOX = { s: 54.735, n: 54.800, w: -1.625, e: -1.525 };

  // ---------- Tiny helpers ----------
  const $ = id => document.getElementById(id);

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const TZ = "Europe/London";
  const fmt = (d, o) => new Intl.DateTimeFormat("en-GB", { timeZone: TZ, ...o }).format(d);
  const hm = d => fmt(d, { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  const dayKey = d => fmt(d, { year: "numeric", month: "2-digit", day: "2-digit" });
  const catOf = e => CATS[e.category] ? e.category : "other";
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
  };
  const randomId = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b => b.toString(16).padStart(2, "0")).join(""); };
  let DEVICE = store.get("mm_device", null);

  let toastTimer;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2800); }

  function londonDate(dateStr, timeStr) {
    if (!dateStr || !timeStr) return null;
    const [y, mo, d] = dateStr.split("-").map(Number), [hh, mm] = timeStr.split(":").map(Number);
    if ([y, mo, d, hh, mm].some(Number.isNaN)) return null;
    let guess = Date.UTC(y, mo - 1, d, hh, mm);
    for (let i = 0; i < 2; i++) {
      const g = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date(guess)).map(p => [p.type, p.value]));
      guess += Date.UTC(y, mo - 1, d, hh, mm) - Date.UTC(+g.year, +g.month - 1, +g.day, +g.hour, +g.minute);
    }
    return new Date(guess);
  }
  const londonParts = date => {
    const g = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(date).map(p => [p.type, p.value]));
    return { date: `${g.year}-${g.month}-${g.day}`, time: `${g.hour}:${g.minute}` };

  // ---------- Data layer: Supabase, or this-phone-only demo mode ----------
  const LIVE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);

    async req(path, opts = {}) {
      const res = await fetch(CONFIG.SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/" + path, {
        ...opts,
        headers: { apikey: CONFIG.SUPABASE_ANON_KEY, Authorization: "Bearer " + CONFIG.SUPABASE_ANON_KEY, "Content-Type": "application/json", ...(opts.headers || {}) },
      });
      if (!res.ok) { let msg = res.statusText; try { msg = (await res.json()).message || msg; } catch (_) {} throw new Error(msg); }
      const txt = await res.text();
      return txt ? JSON.parse(txt) : null;
    },
    async load() {
      if (!LIVE) return { events: store.get("mm_demo_events", []), going: store.get("mm_demo_going", []) };
      const since = new Date(Date.now() - 864e5).toISOString();
      const [events, going] = await Promise.all([
        api.req(`events?select=*&start_at=gte.${encodeURIComponent(since)}&order=start_at.asc&limit=500`),
        api.req("going?select=event_id,device_id&limit=5000"),
      ]);
      return { events, going };
    },
    async create(ev) {
      const token = randomId(16);
      let id;
      if (LIVE) id = await api.req("rpc/create_event", { method: "POST", body: JSON.stringify({ p_event: ev, p_token: token }) });
      else { id = randomId(8); const all = store.get("mm_demo_events", []); all.push({ id, created_at: new Date().toISOString(), ...ev }); store.set("mm_demo_events", all); }
      const tokens = store.get("mm_tokens", {}); tokens[id] = token; store.set("mm_tokens", tokens);
      return id;
    },
    async getEvent(id) {
      if (!/^[0-9a-f-]{8,40}$/i.test(id)) return null;
      if (LIVE) { const rows = await api.req("rpc/get_event", { method: "POST", body: JSON.stringify({ p_event_id: id }) }); return (rows && rows[0]) || null; }
      return store.get("mm_demo_events", []).find(e => e.id === id) || null;
    },
    async remove(id) {
      const token = store.get("mm_tokens", {})[id];
      if (!token) return false;
      if (LIVE) return await api.req("rpc/delete_event", { method: "POST", body: JSON.stringify({ p_event_id: id, p_token: token }) });
      store.set("mm_demo_events", store.get("mm_demo_events", []).filter(e => e.id !== id));
      return true;
    },
    async update(id, ev) {
      const token = store.get("mm_tokens", {})[id];
      if (!token) throw new Error("Only the person who posted this event can edit it");
      if (LIVE) return await api.req("rpc/update_event", { method: "POST", body: JSON.stringify({ p_event_id: id, p_token: token, p_event: ev }) });
      store.set("mm_demo_events", store.get("mm_demo_events", []).map(e => e.id === id ? { ...e, ...ev } : e));
      return true;
    },
    async setGoing(id, going) {
      if (LIVE) return api.req("rpc/set_going", { method: "POST", body: JSON.stringify({ p_event_id: id, p_device: DEVICE, p_going: going }) });
      let g = store.get("mm_demo_going", []).filter(r => !(r.event_id === id && r.device_id === DEVICE));
      if (going) g.push({ event_id: id, device_id: DEVICE });
      store.set("mm_demo_going", g);
    },
  };

  // ---------- State ----------
  const state = { events: [], linked: new Map(), going: new Map(), loaded: false, time: "week", cats: new Set(), selected: null, q: "", sort: "popular" };
  // Invite-only events this phone knows about (made here, or opened from a link)
  const linkIds = () => store.get("mm_links", []);
  const rememberLink = id => { const l = linkIds().filter(x => x !== id); l.unshift(id); store.set("mm_links", l.slice(0, 30)); };
  const allEvents = () => { const ids = new Set(state.events.map(e => e.id)); return [...state.events, ...[...state.linked.values()].filter(e => !ids.has(e.id))]; };
  const findEvent = id => allEvents().find(e => e.id === id);
  const stopsOf = e => Array.isArray(e && e.stops) ? e.stops.filter(s => s && Number.isFinite(+s.lat) && Number.isFinite(+s.lng)) : [];
  const eventUrl = id => location.origin + location.pathname + "?e=" + encodeURIComponent(id);
  function goingCount(id) { return (state.going.get(id) || new Set()).size; }

  async function refresh() {
    try {
      const { events, going } = await api.load();
      state.events = (events || []).filter(e => e.start_at && Number.isFinite(+e.lat) && Number.isFinite(+e.lng));
      const publicIds = new Set(state.events.map(e => e.id));
      const want = linkIds().filter(id => !publicIds.has(id));
      const got = await Promise.all(want.map(id => api.getEvent(id).catch(() => undefined)));

  // ---------- Filtering ----------
  function inTime(e, now = new Date()) {
    const start = new Date(e.start_at);
    if (Number.isNaN(+start)) return false;
    let end = e.end_at ? new Date(e.end_at) : new Date(+start + 4 * 3600e3);
    const st = stopsOf(e);
    if (st.length) { const last = new Date(st[st.length - 1].time); if (!Number.isNaN(+last) && +last + 3 * 3600e3 > +end) end = new Date(+last + 3 * 3600e3); }
    if (end < now) return false;
    if (state.time === "all") return true;
    if (state.time === "week") return start - now < 7 * 864e5;
    return start < londonDate(londonParts(new Date(+now + 864e5)).date, "06:00");
  }
  const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[’']/g, "");
  function haystack(e) {
    const d = new Date(e.start_at);
    const parts = [e.title, e.venue_name, e.host, e.description, e.price, CATS[catOf(e)].label,
      e.is_private ? "house party private" : e.address,
      Number.isNaN(+d) ? "" : fmt(d, { weekday: "long" }) + " " + fmt(d, { day: "numeric", month: "long" }),
      dayKey(d) === dayKey(new Date()) ? "today tonight" : "",
      e.visibility === "link" ? "invite only" : "",
      stopsOf(e).map(x => x.name).join(" ")];
    const p = PLACE_BY_NAME.get(String(e.venue_name || "").toLowerCase());
    if (p) parts.push(p.aliases.join(" "));
    return norm(parts.join(" "));

    const words = norm(state.q).split(/\s+/).filter(Boolean);

  const visibleEvents = () => allEvents()

  // ---------- Map ----------
  const map = L.map("map", { zoomControl: false, attributionControl: true, tap: true }).setView(HOME.center, HOME.zoom);
  const TILE_URL = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";

  const areaLayer = L.layerGroup().addTo(map);
  for (const [t, lat, lng] of AREA_LABELS) {

  const eventLayer = L.layerGroup().addTo(map);
  let meMarker = null;
  function zoomClasses() {

    eventLayer.clearLayers();

      const k = (+e.lat).toFixed(4) + "," + (+e.lng).toFixed(4);

      groups.get(k).push(e);
    }
    for (const list of groups.values()) {
      list.forEach((e, i) => {
        const c = CATS[catOf(e)].color;

        }
        let ox = 0, oy = 0;
        if (list.length > 1) { const a = (i / list.length) * Math.PI * 2 - Math.PI / 2; ox = Math.cos(a) * 16; oy = Math.sin(a) * 16; }
        let title = (e.title || "Event").length > 26 ? e.title.slice(0, 25) + "…" : (e.title || "Event");
        if (stopsOf(e).length && e.id !== state.selected) title += ` · ${stopsOf(e).length + 1} stops`;
        const icon = L.divIcon({

  const MODELS = ["gemini-flash-latest", "gemini-3-flash-preview", "gemini-3.1-flash-lite", "gemini-2.5-flash"];
  async function shrink(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL("image/jpeg", 0.85).split(",")[1];
    } finally { URL.revokeObjectURL(url); }
  }
  function extractionPrompt() {
    const today = fmt(new Date(), { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    const places = PLACES.map(p => `- ${p.name}${p.aliases.length ? " (" + p.aliases.join(", ") + ")" : ""}`).join("\n");
    return `You are reading a screenshot of an Instagram post, story or poster advertising a student event in Durham, UK.
Today is ${today} (UK time). Resolve relative dates such as "tonight", "this Friday" or "Fri 23rd" to the next matching date on or after today.

Durham places. If the venue clearly refers to one of these, give its exact name as venue_match (nicknames in brackets):
${places}

Reply with only a JSON object with these keys:
{"is_event": boolean, "title": string, "category": "party" | "social" | "sport" | "society" | "other", "date": "YYYY-MM-DD" or null, "start_time": "HH:MM" 24h or null, "end_time": "HH:MM" 24h or null, "venue_text": the location exactly as written or null, "venue_match": exact place name from the list or null, "address": a street address if one is shown, or null, "host": the organising account, society or college, or null, "price": e.g. "Free", "£5", or null, "description": one short sentence in your own words or null, "is_private": true if it is a house party or at a private home, "confidence": number 0 to 1}

Use the event's own name as title (short, no emojis). Never guess a date or time you cannot see: use null.`;
  }
  async function readWithGemini(file, signal) {
    const data = await shrink(file);
    const body = JSON.stringify({
      contents: [{ parts: [{ text: extractionPrompt() }, { inline_data: { mime_type: "image/jpeg", data } }] }],
      generationConfig: { responseMimeType: "application/json", temperature: 0.1 },
    });
    let lastErr = "No model answered";
    const tried = store.get("mm_gemini_model", null);
    const order = tried ? [tried, ...MODELS.filter(m => m !== tried)] : MODELS;
    for (const model of order) {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(geminiKey())}`, { method: "POST", headers: { "Content-Type": "application/json" }, body, signal });
      if (res.status === 404 || res.status === 400 && model !== order[order.length - 1]) {
        try { lastErr = (await res.json()).error.message; } catch (_) {}
        if (res.status === 400 && /API key/i.test(lastErr)) throw new Error("key");
        continue;
      }
      if (res.status === 401 || res.status === 403) throw new Error("key");
      if (res.status === 429) throw new Error("rate");
      if (!res.ok) { try { lastErr = (await res.json()).error.message; } catch (_) {} throw new Error(lastErr); }
      const json = await res.json();
      store.set("mm_gemini_model", model);
      const text = json?.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "";
      const m = text.match(/\{[\s\S]*\}/);
      if (!m) throw new Error("parse");
      return JSON.parse(m[0]);
    }
    throw new Error(lastErr);
  }

    drop.append(h("strong", null, "Drop in a screenshot"), h("p", null, "A poster, an Instagram post or a story. The name, date, time and place fill themselves in. You can also paste a screenshot."));
    const input = h("input", "vh"); input.type = "file"; input.id = "shotInput"; input.accept = "image/*";
    const lab = h("label", "btn primary", "Choose screenshot"); lab.htmlFor = "shotInput";
    input.onchange = () => { if (input.files && input.files[0]) startRead(body, input.files[0]); };
    drop.append(input, lab);
    drop.addEventListener("dragover", ev => { ev.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", ev => { ev.preventDefault(); drop.classList.remove("over"); const f = [...(ev.dataTransfer?.files || [])].find(f => f.type.startsWith("image/")); if (f) startRead(body, f); });
    body.appendChild(drop);
    const manual = h("button", "linkish", "Or fill it in by hand"); manual.onclick = () => renderForm(body, {});
    body.appendChild(manual);
    if (!geminiKey()) {
      const n = h("div", "note"); n.append("Screenshot reading needs a free key on this phone. ");
      const s = h("button", "linkish", "Set it up"); s.onclick = () => openKeySetup();
      n.appendChild(s); body.appendChild(n);
    }
  }
  document.addEventListener("paste", ev => {
    const body = $("addBody");
    if ($("addOverlay").hidden || !body || !body.querySelector(".drop")) return;
    const item = [...(ev.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
    const f = item && item.getAsFile();
    if (f) { ev.preventDefault(); startRead(body, f); }
  });
  async function startRead(body, file) {
    if (!geminiKey()) { openKeySetup(() => startRead(body, file)); return; }
    body.textContent = "";
    const wrap = h("div", "reading"); const img = h("img"); img.alt = "Your screenshot";
    const url = URL.createObjectURL(file); img.src = url;
    const st = h("div", "status"); const bar = h("div", "pulse"); bar.appendChild(h("i"));
    const sub = h("span", "hint", "Pulling out the name, date, time and place.");
    const stop = h("button", "linkish", "Stop");
    st.append(h("strong", null, "Reading the poster…"), sub, bar, stop);
    wrap.append(img, st); body.appendChild(wrap);
    extractCtl = new AbortController();
    stop.onclick = () => extractCtl && extractCtl.abort();
    try {
      const out = await readWithGemini(file, extractCtl.signal);
      extractCtl = null; URL.revokeObjectURL(url);
      if (!out || out.is_event === false) { renderForm(body, {}, "That doesn't look like an event poster. Fill it in by hand, or try another screenshot."); return; }
      renderForm(body, out, null, true);
    } catch (err) {
      const aborted = extractCtl && extractCtl.signal.aborted;
      extractCtl = null; URL.revokeObjectURL(url);
      if (aborted || err.name === "AbortError") { renderPick(body); return; }
      let msg = "Couldn't read that screenshot. Fill it in by hand, or try a clearer one.";
      if (err.message === "key") msg = "The Gemini key didn't work. Check it in setup, or fill this in by hand.";
      else if (err.message === "rate") msg = "Too many reads in a row. Wait a minute, or fill it in by hand.";
      renderForm(body, {}, msg);
    }
  }

  function matchPlace(name, text) {
    const pick = s => {
      if (!s) return null;
      const k = String(s).toLowerCase().trim();
      return PLACE_BY_NAME.get(k) || PLACES.find(p => p.aliases.some(a => a.toLowerCase() === k)) ||
        PLACES.find(p => k.includes(p.name.toLowerCase()) || p.aliases.some(a => a.length > 3 && k.includes(a.toLowerCase()))) || null;
    };
    return pick(name) || pick(text);
  }
  async function geocode(q) {
    const u = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=gb&bounded=1&viewbox=${DURHAM_BOX.w},${DURHAM_BOX.n},${DURHAM_BOX.e},${DURHAM_BOX.s}&q=${encodeURIComponent(q)}`;
    const res = await fetch(u, { headers: { "Accept-Language": "en-GB" } });
    if (!res.ok) throw new Error("geo");
    return res.json();
  }

  function renderForm(body, data, warning, fromShot, editing) {
    if (miniMap) { miniMap.remove(); miniMap = null; }
    body.textContent = "";
    if (warning) body.appendChild(h("div", "note warn", warning));
    if (fromShot) body.appendChild(h("div", "note", (typeof data.confidence === "number" && data.confidence < 0.6) ? "Read from your screenshot, but some details were unclear. Check them before posting." : "Read from your screenshot. Check the details and the pin, then post."));
    const form = h("form", "eventform"); form.noValidate = true;
    const field = (id, label, el) => { const f = h("div", "field"); const l = h("label", null, label); l.htmlFor = id; el.id = id; f.append(l, el); return f; };
    const input = (type, value, ph) => { const i = h("input"); i.type = type; if (value != null) i.value = value; if (ph) i.placeholder = ph; return i; };

    const title = input("text", data.title || "", "e.g. Hatfield Halloween bop"); title.maxLength = 80;
    form.appendChild(field("fTitle", "Event name", title));

    const cf = h("div", "field"); cf.appendChild(h("span", "lbl", "Type"));
    const cats = h("div", "cats"); cats.setAttribute("role", "radiogroup"); cats.setAttribute("aria-label", "Type");
    const startCat = CATS[data.category] ? data.category : "social";
    for (const [id, c] of Object.entries(CATS)) {
      const r = h("input"); r.type = "radio"; r.name = "fCat"; r.id = "fCat-" + id; r.value = id; r.checked = id === startCat;
      const l = h("label"); l.htmlFor = r.id; const dot = h("span", "dot"); dot.style.background = c.color; l.append(dot, c.label);
      cats.append(r, l);
    }
    cf.appendChild(cats); form.appendChild(cf);

    const now = londonParts(new Date());
    const date = input("date", data.date || now.date), st = input("time", data.start_time || ""), en = input("time", data.end_time || "");
    const r3 = h("div", "row3"); r3.append(field("fDate", "Date", date), field("fStart", "Starts", st), field("fEnd", "Ends", en));
    form.appendChild(r3);

    // --- Location: quick pick, address search, draggable pin ---
    const sel = h("select");
    const none = h("option", null, "Pick a Durham spot"); none.value = ""; sel.appendChild(none);
    const groups = { college: "Colleges", venue: "Bars and clubs", area: "Areas (house parties)", university: "University", sport: "Sport", landmark: "Around town", outdoor: "Outdoors" };
    for (const [cat, label] of Object.entries(groups)) {
      const og = h("optgroup"); og.label = label;
      for (const p of PLACES.filter(p => p.category === cat)) { const o = h("option", null, p.name); o.value = p.name; og.appendChild(o); }
      sel.appendChild(og);
    }
    const vf = field("fVenue", "Where", sel);
    form.appendChild(vf);

    const sf = h("div", "field"); const sl = h("label", null, "Or search an address"); sl.htmlFor = "fAddr";
    const srow = h("div", "searchrow");
    const addr = input("text", data.address || "", "e.g. 12 Hawthorn Terrace"); addr.id = "fAddr"; addr.maxLength = 200;
    const sbtn = h("button", "btn", "Search"); sbtn.type = "button";
    srow.append(addr, sbtn);
    const results = h("div", "results");
    sf.append(sl, srow, results);
    form.appendChild(sf);

    const mm = h("div"); mm.id = "miniMap";
    const mmHint = h("span", "hint", "Drag the pin, or tap the map, to put it on the exact spot.");
    const mf = h("div", "field"); mf.append(mm, mmHint); form.appendChild(mf);

    // Night-out route: extra stops, each with its own time
    const route = h("div", "field");
    route.append(h("span", "lbl", "Night-out route (optional)"), h("span", "hint", "Add where the night moves next, with times, so people can join later. Stop 1 is the place above."));
    const stopList = h("div", "stops");
    const addStop = h("button", "btn", "+ Add a stop"); addStop.type = "button";
    route.append(stopList, addStop);
    form.appendChild(route);
    const stops = (data.stops || []).map(x => ({ ...x })); let activeStop = null, stopLayer = null;
    const fillPlaces = selEl => {
      for (const [cat, label] of Object.entries({ venue: "Bars and clubs", college: "Colleges", area: "Areas (house parties)", university: "University", sport: "Sport", landmark: "Around town", outdoor: "Outdoors" })) {
        const og = h("optgroup"); og.label = label;
        for (const pl2 of PLACES.filter(x => x.category === cat)) { const o = h("option", null, pl2.name); o.value = pl2.name; og.appendChild(o); }
        selEl.appendChild(og);
      }
    };
    function renderStops() {
      stopList.textContent = "";
      stops.forEach((x, i) => {
        const n = i + 2;
        const row = h("div", "stoprow" + (activeStop === i ? " active" : ""));
        const t = h("input"); t.type = "time"; t.value = x.time || ""; t.setAttribute("aria-label", `Stop ${n} time`);
        t.oninput = () => { x.time = t.value; };
        const s2 = h("select"); s2.setAttribute("aria-label", `Stop ${n} place`);
        const known = PLACE_BY_NAME.has(String(x.name || "").toLowerCase());
        const o0 = h("option", null, x.lat != null && !known ? (x.name || "Pinned spot") : "Pick a spot"); o0.value = ""; s2.appendChild(o0);
        fillPlaces(s2);
        s2.value = known ? x.name : "";
        s2.onchange = () => {
          const pl2 = PLACE_BY_NAME.get(s2.value.toLowerCase()); if (!pl2) return;
          Object.assign(x, { name: pl2.name, lat: pl2.lat, lng: pl2.lng }); activeStop = null;
          drawMiniStops([pl2.lat, pl2.lng]); renderStops();
          mmHint.textContent = `Stop ${n} set to ${pl2.name}. Drag its number on the map to fine-tune.`;
        };
        const pinB = h("button", "pinbtn", activeStop === i ? "Tap map" : "Pin"); pinB.type = "button";
        pinB.setAttribute("aria-label", `Place stop ${n} by tapping the map`);
        pinB.onclick = () => {
          activeStop = activeStop === i ? null : i; renderStops();
          mmHint.textContent = activeStop === null ? "Drag the pin, or tap the map, to put it on the exact spot." : `Tap the map to place stop ${n}.`;
          if (activeStop !== null) mm.scrollIntoView({ block: "center", behavior: "smooth" });
        };
        const rm = h("button", "rmbtn", "×"); rm.type = "button"; rm.setAttribute("aria-label", `Remove stop ${n}`);
        rm.onclick = () => { stops.splice(i, 1); activeStop = null; renderStops(); drawMiniStops(); };
        row.append(h("span", "stopnum", String(n)), t, s2, pinB, rm);
        stopList.appendChild(row);
      });
      addStop.hidden = stops.length >= 6;
    }
    function drawMiniStops(panTo) {
      if (!miniMap) return;
      if (stopLayer) stopLayer.clearLayers(); else stopLayer = L.layerGroup().addTo(miniMap);
      const pts = pinLL ? [pinLL] : [];
      stops.forEach((x, i) => {
        if (x.lat == null) return;
        pts.push([x.lat, x.lng]);
        const m = L.marker([x.lat, x.lng], { draggable: true, icon: L.divIcon({ className: "", iconSize: [0, 0], html: `<div class="stopmark" style="--c:var(--hot)">${i + 2}</div>` }) }).addTo(stopLayer);
        m.on("dragend", () => { const ll = m.getLatLng(); x.lat = ll.lat; x.lng = ll.lng; drawMiniStops(); });
      });
      if (pts.length > 1) L.polyline(pts, { color: "#7c3aed", weight: 3, dashArray: "1 9", lineCap: "round", interactive: false }).addTo(stopLayer);
      if (panTo) miniMap.panTo(panTo);
    }
    addStop.onclick = () => {
      stops.push({ time: "", name: "", lat: null, lng: null });
      activeStop = stops.length - 1; renderStops();
      mmHint.textContent = `Pick a spot for stop ${stops.length + 1}, or tap the map to place it.`;
    };

    let pinLL = null, venueName = "";
    const matched = matchPlace(data.venue_match, data.venue_text);
    if (matched) { sel.value = matched.name; venueName = matched.name; pinLL = [matched.lat, matched.lng]; }
    if (editing) { venueName = editing.venue_name || venueName; pinLL = [+editing.lat, +editing.lng]; }
    let pinMoved = false;
    if (data.venue_text && !editing) {
      const hint = h("span", "hint hot", matched && matched.name.toLowerCase() === String(data.venue_text).toLowerCase() ? "" : `Poster says "${data.venue_text}".`);
      if (hint.textContent) vf.appendChild(hint);
    }

    const priv = h("input"); priv.type = "checkbox"; priv.id = "fPrivate";
    priv.checked = !!data.is_private || !!(matched && matched.category === "area");
    const pl = h("label", "check"); pl.htmlFor = "fPrivate";
    const pt = h("span"); pt.append("Private address", h("small", null, "Show a rough 150 m area on the map instead of the exact spot."));
    pl.append(priv, pt); form.appendChild(pl);

    // Who can see it
    const vf2 = h("div", "field"); vf2.appendChild(h("span", "lbl", "Who can see it"));
    const seg = h("div", "cats seg"); seg.setAttribute("role", "radiogroup"); seg.setAttribute("aria-label", "Who can see it");
    for (const [val, label, sub] of [["public", "Public", "On the map for everyone"], ["link", "Invite only", "Only people you send the link to"]]) {
      const r = h("input"); r.type = "radio"; r.name = "fVis"; r.id = "fVis-" + val; r.value = val; r.checked = val === (data.visibility || "public");
      const l = h("label"); l.htmlFor = r.id; l.append(h("strong", null, label), h("small", null, sub));
      seg.append(r, l);
    }
    vf2.appendChild(seg); form.appendChild(vf2);

    const r2 = h("div", "row");
    const host = input("text", data.host || "", "College, society or @account"); host.maxLength = 60;
    const price = input("text", data.price || "", "Free, £5…"); price.maxLength = 30;
    r2.append(field("fHost", "Host", host), field("fPrice", "Entry", price));
    form.appendChild(r2);
    const desc = h("textarea"); desc.value = data.description || ""; desc.maxLength = 280; desc.placeholder = "Dress code, what to bring, anything people should know";
    form.appendChild(field("fDesc", "Details", desc));

    const err = h("div", "err"); err.hidden = true; form.appendChild(err);
    const acts = h("div", "actions");
    const post = h("button", "btn primary", "Post to the map"); post.type = "submit";
    if (editing) post.textContent = "Save changes";
    const back = h("button", "btn", editing ? "Cancel" : fromShot || warning ? "Try another screenshot" : "Back"); back.type = "button";
    back.onclick = () => { if (editing) { closeAdd(); openCard(editing.id); } else renderPick(body); };
    acts.append(post, back); form.appendChild(acts);
    body.appendChild(form);

    // mini map
    miniMap = L.map(mm, { zoomControl: true, attributionControl: false }).setView(pinLL || HOME.center, pinLL ? 17 : 15);
    L.tileLayer(TILE_URL, { maxZoom: 19 }).addTo(miniMap);
    const pinIcon = L.divIcon({ className: "", iconSize: [0, 0], html: `<div class="pin-wrap selected" style="--c:var(--hot)"><span class="pin"></span></div>` });
    let marker = null;
    const setPin = (ll, zoom) => {
      pinLL = [ll[0], ll[1]]; pinMoved = true;
      if (!marker) {
        marker = L.marker(pinLL, { draggable: true, icon: pinIcon, autoPan: true }).addTo(miniMap);
        marker.on("dragend", () => { const p = marker.getLatLng(); pinLL = [p.lat, p.lng]; pinMoved = true; drawMiniStops(); mmHint.textContent = "Pin moved. That's the spot people will see."; });
      } else marker.setLatLng(pinLL);
      miniMap.setView(pinLL, zoom || Math.max(miniMap.getZoom(), 17));
      drawMiniStops();
    };
    if (pinLL) { setPin(pinLL, 17); pinMoved = false; }
    renderStops(); drawMiniStops();
    miniMap.on("click", ev => {
      if (activeStop !== null && stops[activeStop]) {
        const x = stops[activeStop], n = activeStop + 2;
        Object.assign(x, { lat: ev.latlng.lat, lng: ev.latlng.lng });
        if (!x.name || PLACE_BY_NAME.has(x.name.toLowerCase())) x.name = "Pinned spot";
        activeStop = null; drawMiniStops(); renderStops();
        mmHint.textContent = `Stop ${n} placed. Drag its number to fine-tune.`;
        return;
      }
      setPin([ev.latlng.lat, ev.latlng.lng]); mmHint.textContent = "Pin placed. Drag it to fine-tune.";
    });
    setTimeout(() => miniMap && miniMap.invalidateSize(), 60);

    sel.onchange = () => {
      const p = PLACE_BY_NAME.get(sel.value.toLowerCase());
      if (!p) return;
      venueName = p.name; setPin([p.lat, p.lng], 17);
      if (p.category === "area") priv.checked = true;
      mmHint.textContent = "Pin set to " + p.name + ". Drag it to the exact spot.";
    };
    const runSearch = async () => {
      const q = addr.value.trim();
      if (!q) return;
      results.textContent = ""; sbtn.disabled = true; sbtn.textContent = "Searching…";
      try {
        const found = await geocode(/durham/i.test(q) ? q : q + ", Durham");
        if (!found.length) results.appendChild(h("span", "hint", "No match in Durham. Try a street name, or drag the pin."));
        for (const r of found) {
          const b = h("button", null, r.display_name.replace(/, (County Durham|England|United Kingdom)/g, "").slice(0, 120)); b.type = "button";
          b.onclick = () => {
            setPin([+r.lat, +r.lon], 18); results.textContent = "";
            if (!venueName || sel.value === "") venueName = (r.name || r.display_name.split(",")[0]).slice(0, 120);
            mmHint.textContent = "Pin set from the address. Drag it if it's slightly off.";
          };
          results.appendChild(b);
        }
      } catch (_) { results.appendChild(h("span", "hint", "Address search isn't responding. Drag the pin instead.")); }
      finally { sbtn.disabled = false; sbtn.textContent = "Search"; }
    };
    sbtn.onclick = runSearch;
    addr.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); runSearch(); } });
    // From a screenshot with an address but no known venue: look it up straight away
    if (!editing && !matched && (data.address || data.venue_text)) { if (!addr.value) addr.value = data.address || data.venue_text; runSearch(); }

    form.addEventListener("submit", async ev => {
      ev.preventDefault(); err.hidden = true;
      const start = londonDate(date.value, st.value);
      const problems = [];
      if (!title.value.trim()) problems.push("an event name");
      if (!start) problems.push("a date and start time");
      if (!pinLL) problems.push("a place (pick one, search, or tap the map)");
      stops.forEach((x, i) => { if (!x.time || x.lat == null) problems.push(`a time and place for stop ${i + 2} (or remove it)`); });
      if (problems.length) { err.textContent = "Add " + problems.join(", ") + " to post."; err.hidden = false; return; }
      // stop times roll past midnight in order
      let prev = start;
      const stopsOut = stops.map(x => {
        let t = londonDate(date.value, x.time);
        while (t <= prev) t = new Date(+t + 864e5);
        prev = t;
        return { name: (x.name || "Pinned spot").slice(0, 80), time: t.toISOString(), lat: +x.lat.toFixed(6), lng: +x.lng.toFixed(6) };
      });
      const visibility = form.querySelector('input[name="fVis"]:checked')?.value === "link" ? "link" : "public";
      let end = en.value ? londonDate(date.value, en.value) : null;
      if (end && end <= start) end = new Date(+end + 864e5);
      let [lat, lng] = pinLL;
      // Blur private addresses, but don't nudge an already-blurred pin again on every edit
      if (priv.checked && !(editing && editing.is_private && !pinMoved)) {
        const a = Math.random() * Math.PI * 2, dist = 30 + Math.random() * 60;
        lat += (Math.sin(a) * dist) / 110540; lng += (Math.cos(a) * dist) / (111320 * Math.cos(lat * Math.PI / 180));
      }
      const ev2 = {
        title: title.value.trim(),
        category: form.querySelector('input[name="fCat"]:checked')?.value || "other",
        start_at: start.toISOString(), end_at: end ? end.toISOString() : null,
        venue_name: (sel.value || venueName || "Durham").slice(0, 120),
        address: priv.checked ? null : (addr.value.trim() || null),
        lat: +lat.toFixed(6), lng: +lng.toFixed(6),
        is_private: priv.checked,
        host: host.value.trim() || null, price: price.value.trim() || null, description: desc.value.trim() || null,
        from_screenshot: editing ? !!editing.from_screenshot : !!fromShot,
        visibility, stops: stopsOut,
      };
      if (editing) {
        post.disabled = true; post.textContent = "Saving…";
        try {
          await api.update(editing.id, ev2);
          const full = { ...editing, ...ev2 };
          state.events = state.events.filter(x => x.id !== editing.id); state.linked.delete(editing.id);
          if (visibility === "link") { rememberLink(editing.id); state.linked.set(editing.id, full); } else state.events.push(full);
          closeAdd(); toast("Changes saved");
          if (!inTime(full)) { state.time = "all"; renderChips(); }
          state.selected = editing.id; renderAll(); focusEvent(full); openCard(editing.id);
          refresh();
        } catch (e3) {
          post.disabled = false; post.textContent = "Save changes";
          err.textContent = /Durham/.test(e3.message) ? "That pin is outside Durham. Move it and try again." : /posted/.test(e3.message) ? "Only the phone that posted this event can edit it." : "Couldn't save that. Check your signal and try again.";
          err.hidden = false;
        }
        return;
      }
      post.disabled = true; post.textContent = "Posting…";
      try {
        const id = await api.create(ev2);
        const full = { id, ...ev2 };
        closeAdd();
        if (visibility === "link") {
          rememberLink(id); state.linked.set(id, full);
          let copied = false;
          try { await navigator.clipboard.writeText(eventUrl(id)); copied = true; } catch (_) {}
          toast(copied ? "Posted. Invite link copied, send it to your group." : "Posted. Tap Share to send the invite link.");
        } else {
          toast("Posted to the map");
          if (!state.events.some(e => e.id === id)) state.events.push(full);
        }
        if (!inTime(full)) { state.time = "all"; renderChips(); }
        state.selected = id; renderAll(); focusEvent(full);
        refresh();
      } catch (e3) {
        post.disabled = false; post.textContent = "Post to the map";
        err.textContent = /Durham/.test(e3.message) ? "That pin is outside Durham. Move it and try again." : "Couldn't post that. Check your signal and try again.";
        err.hidden = false;
      }
    });
    title.focus();
  }

  document.addEventListener("keydown", ev => {
    if (ev.key !== "Escape") return;
    if (!$("miscOverlay").hidden) $("miscOverlay").hidden = true;
    else if (!$("addOverlay").hidden) closeAdd();
    else if (!$("cardOverlay").hidden) closeCard();
  });

  // ---------- Boot ----------
  renderChips(); renderList();
  placeChrome();
  window.addEventListener("resize", () => { placeChrome(); map.invalidateSize(); });
  if (!LIVE) {
    const b = $("banner");
    b.innerHTML = "<strong>Demo mode.</strong> Events are saved on this phone only until the database is connected.";
    b.hidden = false;
  }
  const linkedId = new URLSearchParams(location.search).get("e");
  if (linkedId) rememberLink(linkedId);
  refresh().then(() => {
    if (!linkedId) return;
    const e = findEvent(linkedId);
    if (!e) { toast("That event link has expired or was deleted."); return; }
    if (!inTime(e)) { state.time = "all"; renderChips(); renderAll(); }
    focusEvent(e); openCard(e.id);
  });
  setInterval(() => { if (document.visibilityState === "visible" && LIVE) refresh(); }, 20000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && LIVE) refresh(); });
})();
</script>
</body>
</html>
